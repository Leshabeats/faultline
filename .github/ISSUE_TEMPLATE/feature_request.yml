name: Feature request
description: Propose a challenge, simulation rule, workflow, or product improvement.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Learning or product problem
      description: What should a candidate be able to practice or understand?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the interaction, feedback, or judge behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Success signal
      description: How would we know this makes practice better?
    validations:
      required: true
